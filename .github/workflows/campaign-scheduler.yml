name: Campaign scheduler

# Vercel Hobby runs cron jobs at most once per day (and in UTC), so a campaign
# scheduled for, say, 08:15 local would not be picked up until the next daily
# sweep - roughly 20 hours late. This workflow polls the same dispatcher every
# 5 minutes (GitHub's minimum cron granularity) so `scheduled_for` is honoured.
#
# The Vercel cron in vercel.json stays in place as a daily backstop.
#
# Required repository configuration (Settings -> Secrets and variables ->
# Actions):
#   secret  CRON_SECRET  - must match the Vercel project's CRON_SECRET
#   secret  APP_URL      - the deployed root URL, e.g. https://your-app.vercel.app
#
# GitHub disables scheduled workflows in public forks, so this only fires on
# the canonical repository. Runs can be queued a few minutes late under load.

on:
  schedule:
    # every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never cancel an in-flight run: a cancelled run can abandon a campaign
# mid-send, leaving it stuck in "Sending". Overlapping runs queue instead.
concurrency:
  group: campaign-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail fast if secrets are missing
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi

      - name: Trigger due campaigns
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          endpoint="${APP_URL%/}/api/campaigns/schedule"
          echo "POST $endpoint"
          curl --silent --show-error --fail-with-body \
            --max-time 480 \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$endpoint"
